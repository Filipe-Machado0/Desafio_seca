<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VSL Teste</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 10px;
      background: #000;
    }

    .pause-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
    }

    .pause-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .headline {
      text-align: center;
      margin: 24px 0 10px;
      font-size: 22px;
      font-weight: 700;
    }

    .subheadline {
      text-align: center;
      color: #ccc;
      margin-bottom: 20px;
    }

    .cta {
      display: block;
      text-align: center;
      margin-top: 20px;
    }

    .cta a {
      display: inline-block;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 18px;
    }

    .cta a:hover {
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="video-wrapper">
      <video id="video" autoplay muted playsinline controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Seu navegador não suporta vídeo.
      </video>

      <div class="pause-overlay" id="pauseOverlay">
        <img src="pausa_vsl.png" alt="Continue assistindo" />
      </div>
    </div>

    <div class="headline">Essas pessoas assistiram esse vídeo e tiveram resultados reais</div>
    <div class="subheadline">Veja abaixo alguns dos resultados apresentados</div>

    <div class="cta">
      <a href="#">QUERO CONTINUAR</a>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const pauseOverlay = document.getElementById('pauseOverlay');

    video.addEventListener('pause', () => {
      if (!video.ended) {
        pauseOverlay.style.display = 'flex';
      }
    });

    video.addEventListener('play', () => {
      pauseOverlay.style.display = 'none';
    });

    pauseOverlay.addEventListener('click', () => {
      pauseOverlay.style.display = 'none';
      video.play();
    });
  </script>
</body>
</html>
